<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Faucet — Retiros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="toast-host" aria-live="polite"></div>
    <div class="layout">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">π</div>
          <span>Pi Faucet</span>
        </div>
        <nav class="nav">
          <a href="dashboard.html">Panel</a>
          <a href="withdrawals.html" class="active">Retiros</a>
          <a href="admin.html" id="nav-admin" class="hidden">Admin</a>
          <button type="button" class="link" id="btn-logout">Salir</button>
        </nav>
      </header>

      <div class="grid grid-2">
        <div class="card">
          <h2>Solicitar retiro</h2>
          <p class="muted">Mínimo <strong id="min-w">1</strong> π. El saldo no se congela hasta la aprobación del admin; las solicitudes pendientes reducen el disponible.</p>
          <form id="form-w" class="form">
            <div>
              <label for="pi-user">Username Pi Network</label>
              <input id="pi-user" required placeholder="@usuario o nombre Pi" />
            </div>
            <div>
              <label for="pi-amt">Cantidad (π)</label>
              <input id="pi-amt" type="number" step="0.0001" min="1" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%">Enviar solicitud</button>
          </form>
        </div>
        <div class="card">
          <h2>Tu saldo</h2>
          <p class="balance-display"><span id="balance-val">0.0000</span> π</p>
          <p class="muted">Simulación: no se envía Pi real a la mainnet.</p>
        </div>
      </div>

      <div class="card" style="margin-top: 20px">
        <h2>Mis solicitudes</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario Pi</th>
                <th>Cantidad</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="wd-body">
              <tr>
                <td colspan="4" class="muted">Cargando…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/withdrawals-page.js"></script>
  </body>
</html>
